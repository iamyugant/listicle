<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boss Details</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;0,900;1,400&display=swap" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/scripts/header.js"></script>
    <script defer src="/scripts/itemDetails.js"></script>
  </head>
  <body>
    <header></header>
    <main id="item-content" class="container">
      <article class="boss-detail">
        <img id="image" src="" alt="" referrerpolicy="no-referrer" />
        <div class="boss-detail-info">
          <h2 id="name"></h2>
          <dl>
            <dt>Location</dt>
            <dd id="location"></dd>
            <dt>Health</dt>
            <dd id="health"></dd>
            <dt>Reward</dt>
            <dd id="reward"></dd>
          </dl>
          <p id="description" class="boss-description"></p>
          <a href="/" role="button" class="back-button">&larr; All Bosses</a>
        </div>
      </article>
    </main>
  </body>
</html>
